plugins {
    id 'java'
    id 'application'
}

group = 'swp2025.group5'
version = '1.0'

sourceCompatibility = '21'
targetCompatibility = '21'  //target hinzufügen für vollständige Kompatibilität

application {
    mainClass = 'Main'  //besser vollständiger Pfad, siehe unten!
}

jar {
    manifest {
        attributes 'Main-Class': 'Main'  //auch hier vollständiger Pfad
    }
    archiveFileName = ('swp2025_group5.jar')
    destinationDirectory = (file("$projectDir/bin"))
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.2'
}

test {
    useJUnitPlatform()
}
