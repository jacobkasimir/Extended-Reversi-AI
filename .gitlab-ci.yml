stages:
  - build
  - test

build:
  stage: build
  script:
    - ./gradlew clean build
    - echo "Listing files in $(pwd)"
    - find . -type f

  artifacts:
    paths:
      - build/classes/java/main

test:
  stage: test
  script:
    - ./gradlew test
  artifacts:
    when: always
    reports:
      junit: build/test-results/test/*.xml
    paths:
      - build/reports/tests/test