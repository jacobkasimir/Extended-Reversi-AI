stages:
  - build
  - test
  - docs

build:
  stage: build
  script:
    - ./gradlew clean build
  artifacts:
    paths:
      - bin/*.jar
      - build/classes/java/main

test:
  stage: test
  script:
    - ./gradlew test
  artifacts:
    when: always
    reports:
      junit: build/test-results/test/*.xml
    paths:
      - build/reports/tests/test

 
javadoc:
  stage: docs
  image: openjdk:21
  script:
    - ./gradlew clean javadoc
  artifacts:
    paths:
      - build/docs/javadoc